<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you love me?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="question-container container">
    <video class="local-gif" src="Love.mp4" autoplay loop muted playsinline></video>
    <h2 class="question">Do You Love Me?</h2>
    <div class="button-container">
      <button class="yes-btn btn js-yes-btn">Yes</button>
      <button class="no-btn btn js-no-btn">No</button>
    </div>
  </div>

  <div class="result-container container">
    <image class="gif-result" src="Pharuth.jpg" autoplay loop></image>
    <h2>I Love You Too.😍!</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
